# The quickest run: the bundled tiny dataset, FAISS in this process, OpenAI's API.
# pip install -e ".[faiss]"  &&  export OPENAI_API_KEY=...  &&  rag-bench run examples/tiny-faiss.toml

dataset = "tiny"
k = 3

[db]
url = "faiss://"   # HNSW; "faiss://flat" for exact search

[embedder]
model = "text-embedding-3-small"
key_env = "OPENAI_API_KEY"

[llm]
model = "gpt-4o-mini"
key_env = "OPENAI_API_KEY"
