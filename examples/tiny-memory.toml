# The quickest run: the bundled tiny dataset, in-memory search, OpenAI's API.
# export OPENAI_API_KEY=...   then   rag-bench run examples/tiny-memory.toml

dataset = "tiny"
k = 3

[db]
url = "memory://"

[embedder]
model = "text-embedding-3-small"
key_env = "OPENAI_API_KEY"

[llm]
model = "gpt-4o-mini"
key_env = "OPENAI_API_KEY"
