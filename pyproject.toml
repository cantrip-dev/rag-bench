[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-bench"
version = "0.1.0"
description = "Benchmark a plain RAG pipeline with your own vector DB, embedding model and LLM."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
rag-bench = "rag_bench.cli:main"

[project.urls]
Homepage = "https://github.com/cantrip-dev/rag-bench"

[tool.setuptools]
packages = ["rag_bench"]

[tool.setuptools.package-data]
rag_bench = ["data/*.json"]
